services:
  cart-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: angelow_cart_java_api
    restart: unless-stopped
    ports:
      - "${CART_API_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://${CART_DB_HOST:-host.docker.internal}:${CART_DB_PORT:-5435}/${CART_DB_NAME:-angelow_cart}
      SPRING_DATASOURCE_USERNAME: ${CART_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${CART_DB_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      CART_CORS_ALLOWED_ORIGINS: ${CART_CORS_ALLOWED_ORIGINS:-*}
      APP_CART_DEFAULT_PAGE_SIZE: ${APP_CART_DEFAULT_PAGE_SIZE:-20}
      APP_CART_MAX_PAGE_SIZE: ${APP_CART_MAX_PAGE_SIZE:-100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
