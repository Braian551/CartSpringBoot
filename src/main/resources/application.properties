spring.application.name=cart

# Puerto de la aplicación Spring Boot
server.port=8081

# Conexión MySQL
spring.datasource.url=jdbc:mysql://localhost:3309/angelow
spring.datasource.username=myuser
spring.datasource.password=secret

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Protección de endpoints y límites de consultas
app.rate-limit.get-per-minute=120
app.rate-limit.post-per-minute=30
app.rate-limit.delete-per-minute=20
app.rate-limit.cache-max-size=10000
app.rate-limit.expiration-minutes=10
app.rate-limit.cleanup-interval-ms=60000

app.cart.default-page-size=20
app.cart.max-page-size=100
app.cart.max-page-number=10000

# Rechaza formularios desproporcionadamente grandes y evita detalles técnicos en errores.
server.tomcat.max-http-form-post-size=128KB
server.tomcat.max-swallow-size=128KB
server.tomcat.max-parameter-count=100
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
spring.web.error.include-path=never

# Security está configurada para permitir el CRUD sin autenticación; evita que
# Spring cree y registre una contraseña temporal que la aplicación no utiliza.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Logging de la aplicación: consola + archivo persistente relativo al directorio
# desde el que se inicia Spring Boot. Si la aplicación se containeriza en el
# futuro, montar el directorio del host en /app/logs para conservar estos archivos.
logging.file.name=logs/cart.log
logging.logback.rollingpolicy.file-name-pattern=logs/cart-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
