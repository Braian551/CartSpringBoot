<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
<header th:replace="~{fragments/header :: header}"></header>

<main class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:py-16">
    <a th:href="@{/cart}" class="inline-flex items-center gap-2 text-sm text-slate-400 transition hover:text-white">
        <span aria-hidden="true">←</span>
        Volver a carritos
    </a>

    <section class="mt-6 overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl shadow-slate-950/30">
        <div class="border-b border-slate-800 bg-slate-900/80 px-6 py-6 sm:px-8">
            <p class="mb-2 text-sm font-medium text-emerald-400">Registro de carrito</p>
            <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight text-white sm:text-3xl">Detalle del carrito</h1>
                    <p class="mt-2 text-sm text-slate-400">Consulta los datos asociados a este carrito de compra.</p>
                </div>
                <span class="inline-flex w-fit rounded-full border border-emerald-500/20 bg-emerald-500/10 px-3 py-1 text-xs font-medium text-emerald-400">Registrado</span>
            </div>
        </div>

        <dl class="divide-y divide-slate-800 px-6 sm:px-8">
            <div class="grid gap-2 py-5 sm:grid-cols-[10rem_1fr] sm:gap-6">
                <dt class="text-sm font-medium text-slate-500">ID</dt>
                <dd class="font-mono text-sm text-slate-200" th:text="${cart.id}">1</dd>
            </div>
            <div class="grid gap-2 py-5 sm:grid-cols-[10rem_1fr] sm:gap-6">
                <dt class="text-sm font-medium text-slate-500">ID de usuario</dt>
                <dd class="break-words text-sm text-white" th:text="${cart.userId ?: 'Sin usuario asociado'}">user-1</dd>
            </div>
            <div class="grid gap-2 py-5 sm:grid-cols-[10rem_1fr] sm:gap-6">
                <dt class="text-sm font-medium text-slate-500">ID de sesión</dt>
                <dd class="break-words text-sm text-white" th:text="${cart.sessionId ?: 'Sin sesión asociada'}">session-1</dd>
            </div>
            <div class="grid gap-2 py-5 sm:grid-cols-[10rem_1fr] sm:gap-6">
                <dt class="text-sm font-medium text-slate-500">Creado</dt>
                <dd class="text-sm text-slate-300" th:text="${#temporals.format(cart.createdAt, 'dd/MM/yyyy HH:mm:ss')}">24/08/2026 10:30:00</dd>
            </div>
            <div class="grid gap-2 py-5 sm:grid-cols-[10rem_1fr] sm:gap-6">
                <dt class="text-sm font-medium text-slate-500">Última actualización</dt>
                <dd class="text-sm text-slate-300" th:text="${#temporals.format(cart.updatedAt, 'dd/MM/yyyy HH:mm:ss')}">24/08/2026 10:30:00</dd>
            </div>
        </dl>

        <div class="flex flex-col-reverse gap-3 border-t border-slate-800 px-6 py-5 sm:flex-row sm:justify-end sm:px-8">
            <a th:href="@{/cart}" class="inline-flex items-center justify-center rounded-lg border border-slate-700 px-4 py-2.5 text-sm font-medium text-slate-300 transition hover:border-slate-600 hover:bg-slate-800 hover:text-white">Volver</a>
            <a th:href="@{/cart/{id}/edit(id=${cart.id})}" class="inline-flex items-center justify-center rounded-lg bg-amber-500 px-4 py-2.5 text-sm font-medium text-slate-950 transition hover:bg-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500/40">Editar</a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
