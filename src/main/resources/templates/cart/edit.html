<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
<header th:replace="~{fragments/header :: header}"></header>

<main class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:py-16">
    <a th:href="@{/cart/{id}(id=${cart.id})}" class="inline-flex items-center gap-2 text-sm text-slate-400 transition hover:text-white">
        <span aria-hidden="true">←</span>
        Volver al detalle
    </a>

    <section class="mt-6 rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl shadow-slate-950/30 sm:p-8">
        <div class="mb-8">
            <p class="mb-2 text-sm font-medium text-amber-400">Editar registro</p>
            <h1 class="text-2xl font-semibold tracking-tight text-white sm:text-3xl">Editar carrito</h1>
            <p class="mt-3 text-sm text-slate-400">Actualiza los identificadores sin modificar las fechas automáticas.</p>
        </div>

        <form th:action="@{/cart/{id}(id=${cart.id})}" th:object="${cart}" method="post" class="space-y-6">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label for="userId" class="mb-2 block text-sm font-medium text-slate-300">ID de usuario <span class="text-slate-500">(opcional)</span></label>
                <input id="userId" type="text" th:field="*{userId}" maxlength="50" autocomplete="off"
                       class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                <p th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="mt-2 text-xs text-red-400">ID de usuario inválido</p>
            </div>

            <div>
                <label for="sessionId" class="mb-2 block text-sm font-medium text-slate-300">ID de sesión <span class="text-slate-500">(opcional)</span></label>
                <input id="sessionId" type="text" th:field="*{sessionId}" maxlength="255" autocomplete="off"
                       class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                <p th:if="${#fields.hasErrors('sessionId')}" th:errors="*{sessionId}" class="mt-2 text-xs text-red-400">ID de sesión inválido</p>
            </div>

            <div class="flex flex-col-reverse gap-3 border-t border-slate-800 pt-6 sm:flex-row sm:justify-end">
                <a th:href="@{/cart/{id}(id=${cart.id})}" class="inline-flex items-center justify-center rounded-lg border border-slate-700 px-4 py-2.5 text-sm font-medium text-slate-300 transition hover:border-slate-600 hover:bg-slate-800 hover:text-white">Cancelar</a>
                <button type="submit" class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40">Guardar cambios</button>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
